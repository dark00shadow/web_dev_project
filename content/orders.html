<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Confirmed Orders — Equinox Store</title>
  <link rel="stylesheet" href="../style/index.css">
  <link rel="stylesheet" href="../style/orders.css">
  <link rel="stylesheet" href="../style/mobile.css">
  <script src="../javascript/theme.js"></script>
  <script src="../javascript/common.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../javascript/orders.js" defer></script>
</head>
<body class="orders-page">
  <nav class="navbar">
    <button class="hamburger" aria-label="Toggle menu" onclick="toggleSidebar()">&#9776;</button>
    <a href="../index.html" class="logo-link"><h1 class="logo">Equinox <span class="logo-store-text">Store</span></h1></a>
    <div class="navbar-search">
      <form class="search-form" action="products.html" method="GET">
        <input type="search" name="search" class="search-input" placeholder="Search clothes..." aria-label="Search clothes">
        <button type="submit" class="search-btn" aria-label="Search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </div>
    <div class="navbar-right">
      <div class="cart-icon-wrapper" onclick="window.location.href='cart.html'" title="View Cart">
        <svg class="nav-cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge">0</span>
      </div>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
        <div class="theme-toggle-inner">
          <div class="theme-toggle-front">☀️</div>
          <div class="theme-toggle-back">❄️</div>
        </div>
      </button>
      <div class="auth-buttons">
        <a href="#" class="nav-btn" onclick="openCenteredPopup('login.html', 'login', 520, 800)">Login</a>
        <a href="#" class="nav-btn primary" onclick="openCenteredPopup('register.html', 'register', 550, 950)">Register</a>
      </div>
    </div>
  </nav>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button class="close-btn" aria-label="Close menu" onclick="toggleSidebar()">&times;</button>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-auth-buttons">
        <a href="#" class="sidebar-auth-btn login-btn" onclick="openCenteredPopup('login.html', 'login', 520, 800)">Login</a>
        <a href="#" class="sidebar-auth-btn register-btn" onclick="openCenteredPopup('register.html', 'register', 550, 950)">Register</a>
      </div>
      <hr class="mobile-only-divider">
      <a href="../index.html">Home</a>
      <a href="products.html">Catalog</a>
      <a href="orders.html" class="active">Receipts</a>
      <a href="../index.html#about">About Us</a>
    </nav>
  </aside>

  <main class="content orders-main">
    <div class="orders-container">
      <header class="orders-hero">
        <h1>Your Purchase History</h1>
        <p>Review your past orders and download your receipts.</p>
      </header>

      <div id="orders-list" class="orders-list" aria-live="polite"></div>

      <div class="orders-actions">
        <button id="download-history-btn" class="orders-continue-btn">Download PDF History</button>
        <a href="products.html" class="orders-continue-btn">Continue Shopping</a>
      </div>
    </div>
  </main>
</body>
</html>
