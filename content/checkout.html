<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Complete Order — Equinox Store</title>
  <link rel="stylesheet" href="../style/index.css">
  <link rel="stylesheet" href="../style/checkout.css">
  <link rel="stylesheet" href="../style/mobile.css">
  <script src="../javascript/theme.js"></script>
  <script src="../javascript/common.js" defer></script>
  <script src="../javascript/validation.js" defer></script>
  <script src="../javascript/checkout.js" defer></script>
</head>
<body class="checkout-page">
  <nav class="navbar">
    <button class="hamburger" aria-label="Toggle menu" onclick="toggleSidebar()">&#9776;</button>
    <a href="#" class="logo-link" onclick="navigateParent('../index.html')"><h1 class="logo">Equinox <span class="logo-store-text">Store</span></h1></a>
    <div class="navbar-right">
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
        <div class="theme-toggle-inner">
          <div class="theme-toggle-front">☀️</div>
          <div class="theme-toggle-back">❄️</div>
        </div>
      </button>
      <a href="#" class="nav-btn" onclick="openCenteredPopup('login.html', 'popup', 520, 800)">Login</a>
      <a href="#" class="nav-btn primary" onclick="openCenteredPopup('register.html', 'popup', 520, 800)">Register</a>
    </div>
  </nav>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button class="close-btn" aria-label="Close menu" onclick="toggleSidebar()">&times;</button>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-auth-buttons">
        <a href="#" class="sidebar-auth-btn login-btn" onclick="openCenteredPopup('login.html', 'login', 520, 800)">Login</a>
        <a href="#" class="sidebar-auth-btn register-btn" onclick="openCenteredPopup('register.html', 'register', 550, 950)">Register</a>
      </div>
      <hr class="mobile-only-divider">
      <a href="#" onclick="navigateParent('../index.html')">Home</a>
      <a href="#" onclick="navigateParent('products.html')">Catalog</a>
      <a href="#" onclick="navigateParent('orders.html')">Receipts</a>
      <a href="#" onclick="navigateParent('../index.html#about')">About Us</a>
    </nav>
  </aside>

  <main class="checkout-card">
    <header class="checkout-header">
      <h3>Finalize Purchase</h3>
      <p>Please enter your shipping and billing information.</p>
    </header>
    <form id="checkout-form">
      <div class="input-row">
        <div class="input-group">
          <label for="fname">Family Name</label>
          <input type="text" id="fname" placeholder="Family name" required>
        </div>
        <div class="input-group">
          <label for="prenom">Name</label>
          <input type="text" id="prenom" placeholder="Name" required>
        </div>
      </div>
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="email@example.com" required>
      </div>
      <div class="input-group">
        <label for="phone">Contact Number</label>
        <input type="tel" id="phone" placeholder="0XXXXXXXXX" maxlength="10" required>
      </div>
      <div class="input-group">
        <label for="wilaya-trigger">Wilaya</label>
        <div class="location-dropdown" id="wilaya-dropdown">
          <select id="wilaya" class="location-select-native" required tabindex="-1" aria-hidden="true">
            <option value="" disabled selected>Select a wilaya</option>
          </select>
          <button type="button" class="location-dropdown-trigger" id="wilaya-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="location-dropdown-value">Select a wilaya</span>
            <span class="location-dropdown-chevron" aria-hidden="true"></span>
          </button>
          <ul class="location-dropdown-menu" id="wilaya-menu" role="listbox" hidden></ul>
        </div>
      </div>
      <div class="input-group municipality-group hidden" id="municipality-group">
        <label for="municipality-trigger">Municipality</label>
        <div class="location-dropdown" id="municipality-dropdown">
          <select id="municipality" class="location-select-native" required disabled tabindex="-1" aria-hidden="true">
            <option value="" disabled selected>Select a Municipality</option>
          </select>
          <button type="button" class="location-dropdown-trigger" id="municipality-trigger" aria-haspopup="listbox" aria-expanded="false" disabled>
            <span class="location-dropdown-value">Select a Municipality</span>
            <span class="location-dropdown-chevron" aria-hidden="true"></span>
          </button>
          <ul class="location-dropdown-menu" id="municipality-menu" role="listbox" hidden></ul>
        </div>
      </div>
      <div class="input-group">
        <label for="location">Shipping Location</label>
        <input type="text" id="location" placeholder="Full address">
      </div>
      <div class="input-group">
        <label for="delivery-method">Delivery Method</label>
        <select id="delivery-method" required>
          <option value="" disabled selected hidden>Select Delivery Method</option>
          <option value="center">Delivery Center</option>
          <option value="home">Home Delivery</option>
        </select>
      </div>
      <div class="input-group">
        <label for="payment">Payment Method</label>
        <select id="payment" required>
          <option value="bank">bank card</option>
          <option value="edahabia">Edahabia card</option>
          <option value="delivery" selected>Cash on Delivery</option>
        </select>
        <span id="payment-error" class="error-message" style="display: none;">payment option unavailable</span>
      </div>
      <div class="checkout-actions">
        <button type="submit" class="submit-btn" disabled>Place Order</button>
        <button type="button" class="back-btn" id="back-to-cart">Back to Cart</button>
      </div>
    </form>
  </main>
</body>
</html>
