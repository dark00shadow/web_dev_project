<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Product Details — Equinox Store</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="product-details.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="common.js" defer></script>
  <script src="product-details.js" defer></script>
</head>
<body class="details-page">

  <!-- Navbar -->
  <nav class="navbar">
    <button class="hamburger" aria-label="Toggle menu" onclick="toggleSidebar()">&#9776;</button>
    <a href="index.html" class="logo-link"><h1 class="logo">Equinox <span class="logo-store-text">Store</span></h1></a>
    <div class="navbar-search">
      <form class="search-form" action="products.html" method="GET">
        <input type="search" name="search" class="search-input" placeholder="Search clothes..." aria-label="Search">
        <button type="submit" class="search-btn">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </div>
    <div class="navbar-right">
      <div class="cart-icon-wrapper" onclick="window.location.href='cart.html'" title="View Cart">
        <svg class="nav-cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge">0</span>
      </div>
      <button id="theme-toggle" class="theme-toggle-btn">
        <div class="theme-toggle-inner">
          <div class="theme-toggle-front">☀️</div>
          <div class="theme-toggle-back">❄️</div>
        </div>
      </button>
      <a href="#" class="nav-btn" onclick="openCenteredPopup('login.html', 'login', 520, 800)">Login</a>
      <a href="#" class="nav-btn primary" onclick="openCenteredPopup('register.html', 'register', 550, 950)">Register</a>
    </div>
  </nav>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button class="close-btn" onclick="toggleSidebar()">&times;</button>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Catalog</a>
      <a href="orders.html">Receipts</a>
      <hr>
      <a href="index.html#about">About Us</a>
      <hr class="mobile-only-divider">
      <div class="sidebar-auth-buttons">
        <a href="#" class="sidebar-auth-btn login-btn" onclick="openCenteredPopup('login.html', 'login', 520, 800)">Login</a>
        <a href="#" class="sidebar-auth-btn register-btn" onclick="openCenteredPopup('register.html', 'register', 550, 950)">Register</a>
      </div>
    </nav>
  </aside>

  <main class="details-page-content">
    <!-- Product Details Container -->
    <section class="details-container" id="details-view">
      <!-- Injected by product-details.js -->
    </section>

    <!-- Similar Products Slider -->
    <section class="seasonal-slider-section" id="similar-section" style="display: none;">
      <h3 id="similar-title">Similar Products</h3>
      <div class="slider-wrapper" id="similar-wrapper"></div>
    </section>

    <!-- Other Seasonal Products Slider -->
    <section class="seasonal-slider-section" id="seasonal-section" style="display: none;">
      <h3 id="seasonal-title">Other Seasonal Products</h3>
      <div class="slider-wrapper" id="seasonal-wrapper"></div>
    </section>
  </main>

</body>
</html>
