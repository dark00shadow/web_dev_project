<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothes Store</title>
    <link rel="stylesheet" href="index.css">
    <script src="theme.js"></script>
    <script src="common.js" defer></script>
    <script src="index.js" defer></script>
  </head>

  <body>
    <!-- Navbar with Hamburger Button -->
    <nav class="navbar">
      <button class="hamburger" aria-label="Toggle menu" onclick="toggleSidebar()">&#9776;</button>
      <a href="index.html" class="logo-link"><h1 class="logo">Clothes Store</h1></a>
      <div class="navbar-search">
        <form class="search-form" action="products.html" method="GET">
          <input type="search" name="search" class="search-input" id="navbar-search-input" placeholder="Search clothes..." aria-label="Search clothes">
          <button type="submit" class="search-btn" aria-label="Search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </form>
      </div>
      <div class="navbar-right">
        <a href="#" class="nav-btn" onclick="openCenteredPopup('login.html', 'popup', 520, 800)">Login</a>
        <a href="#" class="nav-btn primary" onclick="openCenteredPopup('register.html', 'popup', 520, 800)">Register</a>
      </div>
    </nav>

    <!-- Sliding Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button class="close-btn" aria-label="Close menu" onclick="toggleSidebar()">&times;</button>
      </div>
      <nav class="sidebar-nav">
        <a href="#home">Home</a>
        <a href="products.html">Products</a>
        <a href="#about">About Us</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="content">
      <div class="landing-container">
        <div class="hero-layout">
          <!-- Seasonal Vertical Image (Now on the left) -->
          <aside class="seasonal-vertical-image">
            <img src="images/other media/misty-mountain-peaks-stockcake.webp" alt="Winter Scene" class="winter-img">
            <img src="images/other media/pngtree-summer-travel-destination-background-beach-scene-sun-beds-umbrella-and-palm-image_16266248.jpg" alt="Summer Scene" class="summer-img">
          </aside>

          <!-- Hero Text Content (Now on the right) -->
           <section class="hero-card">
             <div class="winter-content">
               <h2>Cold Weather, Sharp Layers</h2>
               <p>Tailored wools, insulated down, and premium knits. Elevate your winter wardrobe.</p>
             </div>
             <div class="summer-content">
               <h2>High Season Style</h2>
               <p>Effortless silhouettes and sun-drenched hues. Discover our curated summer essentials.</p>
             </div>
           </section>
        </div>

        <!-- Seasonal Product Slider -->
        <section class="seasonal-slider-section">
          <h3 id="seasonal-title">Trending This Season</h3>
          <div class="slider-wrapper">
            <button class="slider-arrow left" id="slider-prev" aria-label="Previous products">❮</button>
            <div id="seasonal-slider" class="product-slider">
              <!-- Seasonal products will be injected here -->
            </div>
            <button class="slider-arrow right" id="slider-next" aria-label="Next products">❯</button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
